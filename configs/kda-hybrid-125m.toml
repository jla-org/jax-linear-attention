#
# Kimi-Linear-like hybrid: three KDA (Kimi Delta Attention) layers per NoPE
# global attention layer, document-masked. Set data.eos_id to your
# tokenizer's eos_token_id (0 for GPT-NeoX).

name = "kda-hybrid-125m"

[model]
preset = "kda-hybrid-125m"

[optim]
name = "adamw"
lr = 1e-3
schedule = "wsd"
warmup_steps = 2000
stable_fraction = 0.8
min_lr_ratio = 0.1
b2 = 0.95
weight_decay = 0.1
max_grad_norm = 1.0

[train]
max_steps = 50000
seq_len = 4096
micro_batch_per_replica = 8
grad_accum = 1
z_loss = 1e-4
log_every = 50
eval_every = 1000
eval_batches = 50
save_every = 2000
output_dir = "runs/kda-hybrid-125m"

[data]
source = "cidx"
paths = ["/path/to/corpus/train"]  # placeholder: a `jla tokenize` output prefix
eval_holdout_records = 4096
eos_id = 0
document_masking = true
num_workers = 4
prefetch = 8

[mesh]
fsdp = -1

[runtime]
xla_tuning_level = 1
