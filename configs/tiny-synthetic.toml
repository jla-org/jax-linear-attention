#
# CPU-friendly smoke run: the "tiny" preset on learnable synthetic tokens.
#   python -m jla.cli train --config configs/tiny-synthetic.toml
# On a GPU drop the compute_dtype override to train in bfloat16.

name = "tiny-synthetic"

[model]
preset = "tiny"
compute_dtype = "float32"  # bfloat16 matmuls are slow on CPU

[optim]
name = "adamw"
lr = 3e-3
schedule = "cosine"
warmup_steps = 10
weight_decay = 0.0

[train]
max_steps = 200
seq_len = 128
micro_batch_per_replica = 8
grad_accum = 2
log_every = 20
eval_every = 100
eval_batches = 4
save_every = 100
output_dir = "runs/tiny-synthetic"

[data]
source = "synthetic"
num_workers = 0
