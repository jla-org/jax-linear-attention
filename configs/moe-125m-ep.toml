#
# moe-125m with expert parallelism on 8 GPUs: the 16 experts are split over an
# "ep" mesh axis of 4 (4 experts per GPU) and the routed tokens travel to their
# experts with all-to-all (jla.distributed.expert_parallel). ep also splits the
# batch, so the dense layers see dp * fsdp * ep = 8 data-parallel replicas
# (fsdp = 2 shards their parameters). Routing, losses and the capacity decisions
# (capacity_factor 1.25) are those of the layer without EP; dispatch blocks hold
# twice the balanced load, and routes past a full block are dropped (second
# choices first) and reported in moe/dropped_fraction together with capacity
# drops (remove expert_parallel_buffer_factor for worst-case blocks that never
# drop). The local experts run on the Mosaic GPU grouped GEMM (H100; other devices
# fall back to jax.lax.ragged_dot). At 8 GPUs EP beats FSDP 4.1x per step and data
# parallelism 2.1x per MoE layer; at 2 GPUs data parallelism is as fast
# (benchmarks/expert_parallel.md).

name = "moe-125m-ep"

[model]
preset = "moe-125m"

[model.moe]
expert_parallel_axis = "ep"
expert_parallel_buffer_factor = 2.0
ragged_dot_impl = "mosaic_gpu"

[optim]
name = "adamw"
lr = 6e-4
schedule = "wsd"
warmup_steps = 2000
stable_fraction = 0.8
min_lr_ratio = 0.1
b2 = 0.95
weight_decay = 0.1
max_grad_norm = 1.0

[train]
max_steps = 50000
seq_len = 2048
micro_batch_per_replica = 16
grad_accum = 1
z_loss = 1e-4
log_every = 50
eval_every = 1000
eval_batches = 50
save_every = 2000
output_dir = "runs/moe-125m-ep"

[data]
source = "cidx"
paths = ["/path/to/corpus/train"]  # placeholder: a `jla tokenize` output prefix
eval_holdout_records = 4096
num_workers = 4
prefetch = 8

[mesh]
fsdp = 2
ep = 4

[runtime]
xla_tuning_level = 1
