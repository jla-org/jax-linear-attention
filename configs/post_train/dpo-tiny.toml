#
# Direct preference optimization smoke run on synthetic preference pairs (CPU or one GPU).
#   jla dpo --config configs/post_train/dpo-tiny.toml
# For real data set dpo.train_path (JSONL with prompt/chosen/rejected), dpo.tokenizer and
# dpo.init_checkpoint (the SFT run's checkpoint directory).
name = "dpo-tiny"

[model]
preset = "tiny"

[optim]
lr = 1e-3
warmup_steps = 5
weight_decay = 0.0

[train]
max_steps = 100
seq_len = 64
micro_batch_per_replica = 8  # preference pairs (two rows each) per data-parallel replica
grad_accum = 1
log_every = 10
eval_every = 50
eval_batches = 4
save_every = 50
output_dir = "runs/dpo-tiny"

[data]
num_workers = 0

[dpo]
beta = 0.1
loss_type = "sigmoid"
synthetic_pairs = 4096
