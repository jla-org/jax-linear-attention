#
# End-to-end run of benchmarks/end_to_end.md: mamba2-130m, 300 steps of 8 x 2048 tokens on one H100.
# data.paths: a `jla tokenize` prefix of FineWeb-Edu built with the Llama-3 tokenizer (128,256 ids).
name = "fw-mamba2-130m"

[model]
preset = "mamba2-130m"
vocab_size = 128256

[optim]
name = "adamw"
lr = 6e-4
schedule = "wsd"
warmup_steps = 100
stable_fraction = 0.8
min_lr_ratio = 0.1
b2 = 0.95
weight_decay = 0.1
max_grad_norm = 1.0

[train]
max_steps = 300
seq_len = 2048
micro_batch_per_replica = 8
grad_accum = 1
z_loss = 1e-4
log_every = 25
eval_every = 150
eval_batches = 8
save_every = 300
keep_checkpoints = 1
output_dir = "runs/fw-mamba2-130m"

[data]
source = "cidx"
paths = ["/path/to/fineweb_edu"]  # placeholder
eval_holdout_records = 2048
num_workers = 4
prefetch = 8

[mesh]
dp = 1
fsdp = -1
tp = 1

[runtime]
xla_tuning_level = 1
