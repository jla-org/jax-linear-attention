#
# benchmarks/end_to_end_1p3b.md: preset transformer-swa-1p3b, seq 4096 with document masking on FineWeb-Edu
# tokenized with the Llama-3.1 tokenizer (128,256 ids, EOS 128001) in 4096-token packed CIDX records.
# micro_batch_per_replica 4 x grad_accum 4 x 4096 = 65,536 tokens per GPU, 524,288 tokens per step on 8 GPUs.
# Run it with benchmarks/bench_e2e_1p3b.py (sets data.paths and the timing settings) or with
#   jla train --config benchmarks/end_to_end/1p3b/transformer-swa-1p3b.toml --set 'data.paths=["/path/to/fineweb_edu_3B"]'
name = "e2e-transformer-swa-1p3b"

[model]
preset = "transformer-swa-1p3b"
# No recompute, lean VJPs and unrolled layers at 4 x 4096 x grad_accum 4 (65,536 tokens per step as before;
# benchmarks/fp8_1p3b.md): 1.076x, 1.125x and 1.074x the step of full remat at 16 x 4096 x 1 in three
# interleaved pairs on one H100 (bf16, 18 Oct 2026, provisional), peak 50.4 GiB against 36.0 GiB; this file
# as written ran at 51,695 tok/s (46.9% MFU) against 46,716-47,737 for full remat, and at 53,794-53,997 tok/s
# (48.8-49.0% MFU, 1.128x and 1.130x) in two later pairs. With FP8 (fp8 = "delayed",
# fp8_min_features = 512, fp8_fused = true) it is about even (0.985x in the clean pair, 1.029x in two later
# pairs). On 8 GPUs (FSDP over 8, bf16) it measured 1.100x in one pair (400,000 tok/s against
# 363,683, peak 28.6 GiB per GPU against 14.9). The previous setting (full remat at 16 x 4096):
#   --micro-batch 16 --grad-accum 1 --set 'model.remat="full"' --set model.lean_vjp=false --set model.scan_layers=true
remat = "none"
lean_vjp = true
scan_layers = false

[model.attention]
# The fused backward of the Mosaic GPU attention kernel (one kernel for dq, dk and dv; benchmarks/attention.md,
# "Fused backward end to end"): 1.042x end to end in bf16 against the ranged pair, faster in both interleaved pairs on one
# H100 (18 Oct 2026, provisional; the throughput figures above were measured with "ranged"). Its dq is added up
# in fp32 by TMA reductions, so runs are not bitwise reproducible; "ranged" (the library default) is.
mosaic_gpu_backward = "fused"
# With FP8 (fp8 = "delayed" and the train step's weight copies; no effect without FP8) the attention backward
# kernels write the q/k/v projections' e5m2 gradients and their amaxes (benchmarks/fp8_1p3b.md, "The recipe
# and the fused paths"): 1.017x on one H100 (19 Oct 2026, provisional). A one-GPU figure: not
# yet timed on 8 GPUs.
fp8_grad_epilogue = true

[optim]
name = "adamw"
lr = 3e-4
schedule = "cosine"
warmup_steps = 5
min_lr_ratio = 0.1
b1 = 0.9
b2 = 0.95
weight_decay = 0.1
max_grad_norm = 1.0

[train]
max_steps = 20
seq_len = 4096
micro_batch_per_replica = 4  # x grad_accum 4 = 65,536 tokens per GPU (see [model])
grad_accum = 4
scan_unroll = 1  # a rolled micro-step loop: unrolled, XLA keeps several micro-steps' activations alive
z_loss = 0.0
# The forward-gradient cross entropy (train.ce_grad_in_forward) stays off: 1.119x on one H100 (FP8) but no 8-GPU
# A/B yet (benchmarks/multi_gpu.md, 19 Oct 2026, provisional).
log_every = 1
eval_every = 0
final_eval = false
save_every = 0
save_final = false
output_dir = "runs/e2e-transformer-swa-1p3b"

[data]
source = "cidx"
paths = ["/path/to/fineweb_edu_3B"]  # the CIDX prefix: bench_e2e_1p3b.py --data, or --set data.paths=[...]
exact_packed_records = true
eos_id = 128001
document_masking = true
num_workers = 4
prefetch = 8

[mesh]
dp = 1
fsdp = -1
tp = 1

[runtime]
xla_tuning_level = 1
