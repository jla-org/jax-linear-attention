#
# benchmarks/end_to_end_1p3b.md: preset gdn-1p3b, seq 4096 with document masking on FineWeb-Edu
# tokenized with the Llama-3.1 tokenizer (128,256 ids, EOS 128001) in 4096-token packed CIDX records.
# micro_batch_per_replica 16 x 4096 = 65,536 tokens per GPU, 524,288 tokens per step on 8 GPUs.
# Run it with benchmarks/bench_e2e_1p3b.py (sets data.paths and the timing settings) or with
#   jla train --config benchmarks/end_to_end/1p3b/gdn-1p3b.toml --set 'data.paths=["/path/to/fineweb_edu_3B"]'
name = "e2e-gdn-1p3b"

[model]
preset = "gdn-1p3b"

[optim]
name = "adamw"
lr = 3e-4
schedule = "cosine"
warmup_steps = 5
min_lr_ratio = 0.1
b1 = 0.9
b2 = 0.95
weight_decay = 0.1
max_grad_norm = 1.0

[train]
max_steps = 20
seq_len = 4096
micro_batch_per_replica = 16
grad_accum = 1
z_loss = 0.0
log_every = 1
eval_every = 0
final_eval = false
save_every = 0
save_final = false
output_dir = "runs/e2e-gdn-1p3b"

[data]
source = "cidx"
paths = ["/path/to/fineweb_edu_3B"]  # the CIDX prefix: bench_e2e_1p3b.py --data, or --set data.paths=[...]
exact_packed_records = true
eos_id = 128001
document_masking = true
num_workers = 4
prefetch = 8

[mesh]
dp = 1
fsdp = -1
tp = 1

[runtime]
xla_tuning_level = 1
