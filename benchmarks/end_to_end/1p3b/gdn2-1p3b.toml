#
# benchmarks/end_to_end_1p3b.md: preset gdn2-1p3b, seq 4096 with document masking on FineWeb-Edu
# tokenized with the Llama-3.1 tokenizer (128,256 ids, EOS 128001) in 4096-token packed CIDX records.
# micro_batch_per_replica 16 x 4096 = 65,536 tokens per GPU, 524,288 tokens per step on 8 GPUs.
# Run it with benchmarks/bench_e2e_1p3b.py (sets data.paths and the timing settings) or with
#   jla train --config benchmarks/end_to_end/1p3b/gdn2-1p3b.toml --set 'data.paths=["/path/to/fineweb_edu_3B"]'
name = "e2e-gdn2-1p3b"

[model]
preset = "gdn2-1p3b"

[optim]
name = "adamw"
lr = 3e-4
schedule = "cosine"
warmup_steps = 5
min_lr_ratio = 0.1
b1 = 0.9
b2 = 0.95
weight_decay = 0.1
max_grad_norm = 1.0

[train]
max_steps = 20
seq_len = 4096
micro_batch_per_replica = 16
grad_accum = 1
z_loss = 0.0
# The forward-gradient cross entropy (train.ce_grad_in_forward, benchmarks/cross_entropy.md) stays off. With the
# CE kernels (ce_impl "auto"), the 20-step bf16 losses of gdn2-1p3b end about 0.02 below the XLA cross entropy's
# in every interleaved pair (kernel runs mean 7.814, n = 8; XLA and float32 CE mean 7.833, n = 10), with or
# without the forward gradient. FP8 shows no offset. The option measured 1.043x (bf16) and 1.052x (FP8) on one
# GPU and 1.052x on 8 GPUs (FSDP 8, FP8), and is left off until the bf16 offset is understood
# (benchmarks/end_to_end_1p3b.md, benchmarks/ce_grad_accuracy_1p3b.py; 20 Oct 2026, provisional; the one-GPU
# pairs were measured before KDA was switched to the remat-optimized vector-gate op).
log_every = 1
eval_every = 0
final_eval = false
save_every = 0
save_final = false
output_dir = "runs/e2e-gdn2-1p3b"

[data]
source = "cidx"
paths = ["/path/to/fineweb_edu_3B"]  # the CIDX prefix: bench_e2e_1p3b.py --data, or --set data.paths=[...]
exact_packed_records = true
eos_id = 128001
document_masking = true
num_workers = 4
prefetch = 8

[mesh]
dp = 1
fsdp = -1
tp = 1

[runtime]
xla_tuning_level = 1
