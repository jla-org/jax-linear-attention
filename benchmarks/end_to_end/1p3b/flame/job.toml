#
# flame job config of the 1.3B end-to-end baseline (benchmarks/end_to_end_1p3b.md).
# benchmarks/bench_e2e_flame.py passes it as --job.config_file and sets the model config, the batch
# geometry (batch_size/seq_len/context_len/varlen), steps, compile and activation checkpointing on the
# command line. The training settings follow benchmarks/end_to_end/1p3b/*.toml of the jla harness:
# AdamW (0.9, 0.95), lr 3e-4, weight decay 0.1, eps 1e-8, 5 warm-up steps then cosine to 0.1 x lr,
# clip 1.0, seed 0, 20 steps. The tokens come from the CIDX corpus through the runner's adapter, so
# the dataset/tokenizer fields are unused.
[model]
name = "fla"
config = "transformer-1p3b.json"
tokenizer_path = "pre-tokenized"

[job]
dump_folder = "exp"
print_args = false

[training]
batch_size = 16
seq_len = 4096
context_len = 4096
varlen = false
gradient_accumulation_steps = 1
steps = 20
max_norm = 1.0
skip_nan_inf = true
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"
compile = true
num_workers = 0
prefetch_factor = 2
pin_memory = false  # flame.train reads these two; only flame's TOML defines them
persistent_workers = false
seed = 0

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1

[lr_scheduler]
warmup_steps = 5
decay_type = "cosine"
lr_min = 0.1

[checkpoint]
enable_checkpoint = false

[profiling]
enable_profiling = false
enable_memory_snapshot = false

[metrics]
log_freq = 1
enable_tensorboard = false
enable_wandb = false

[activation_checkpoint]
mode = "full"

[comm]
trace_buf_size = 0
