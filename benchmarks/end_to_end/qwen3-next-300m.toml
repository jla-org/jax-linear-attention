#
# Train step of the qwen3-next-300m preset (Gated DeltaNet + gated attention + a 64-expert top-10 MoE
# in every layer, MTP depth 1) on one H100, for benchmarks/bench_end_to_end_step.py (synthetic tokens:
# the [data] table is not read). Compare grouped-GEMM paths with
#   --set model.moe.ragged_dot_impl="mosaic_gpu"   (or "xla"; the MoEConfig default is "auto")
name = "qwen3-next-300m-step"

[model]
preset = "qwen3-next-300m"

[optim]
name = "adamw"
lr = 6e-4
schedule = "wsd"
warmup_steps = 100
stable_fraction = 0.8
min_lr_ratio = 0.1
b2 = 0.95
weight_decay = 0.1
max_grad_norm = 1.0

[train]
max_steps = 300
seq_len = 2048
micro_batch_per_replica = 4
grad_accum = 1
z_loss = 1e-4
log_every = 25
final_eval = false  # no evaluation data in this step benchmark
output_dir = "runs/qwen3-next-300m-step"

[data]
source = "cidx"
paths = ["/path/to/corpus/train"]  # placeholder: not read by bench_end_to_end_step.py

[mesh]
dp = 1
fsdp = -1
tp = 1

[runtime]
xla_tuning_level = 1
