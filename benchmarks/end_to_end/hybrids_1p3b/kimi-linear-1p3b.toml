#
# benchmarks/end_to_end_1p3b.md: preset kimi-linear-1p3b, seq 4096 with document masking on FineWeb-Edu
# tokenized with the Llama-3.1 tokenizer (128,256 ids, EOS 128001) in 4096-token packed CIDX records.
# One H100: micro_batch_per_replica 8 x grad_accum 2 x 4096 = 65,536 tokens per step (16 x 4096 in one
# micro-step needed 71.7 GiB on an MoE layer without the per-device dispatch; with it, it peaks at
# 28.8 GiB and was 1.02x faster by median step on one H100, 19 Oct 2026; FSDP 8 ran it, with the forward-
# gradient cross entropy, at 68.7k tokens/s per GPU, a run with no A arm beside it; 8 x 2 stays, as the cross
# entropy below, until an interleaved 8-GPU A/B clears both).
# Multi-GPU: under FSDP each GPU dispatches its own tokens to the dropless MoE (jla.layers.moe; routing every
# GPU's tokens on every GPU does not fit): FSDP 8 trains it at 61.6k tokens/s per GPU (18 Oct 2026).
# Run it with benchmarks/bench_e2e_1p3b.py (sets data.paths and the timing settings) or with
#   jla train --config benchmarks/end_to_end/hybrids_1p3b/kimi-linear-1p3b.toml --set 'data.paths=["/path/to/fineweb_edu_3B"]'
name = "e2e-kimi-linear-1p3b"

[model]
preset = "kimi-linear-1p3b"

[optim]
name = "adamw"
lr = 3e-4
schedule = "cosine"
warmup_steps = 5
min_lr_ratio = 0.1
b1 = 0.9
b2 = 0.95
weight_decay = 0.1
max_grad_norm = 1.0

[train]
max_steps = 20
seq_len = 4096
micro_batch_per_replica = 8
grad_accum = 2
z_loss = 0.0
# The forward-gradient cross entropy (train.ce_impl = "auto", train.ce_grad_in_forward = true) stays off here:
# 1.066x by median step on one H100 (0.97x by the mean, one slow step) and no interleaved 8-GPU A/B
# (benchmarks/end_to_end_1p3b.md, 19 Oct 2026, provisional).
log_every = 1
eval_every = 0
final_eval = false
save_every = 0
save_final = false
output_dir = "runs/e2e-kimi-linear-1p3b"

[data]
source = "cidx"
paths = ["/path/to/fineweb_edu_3B"]  # the CIDX prefix: bench_e2e_1p3b.py --data, or --set data.paths=[...]
exact_packed_records = true
eos_id = 128001
document_masking = true
num_workers = 4
prefetch = 8

[mesh]
dp = 1
fsdp = -1  # one GPU (see above)
tp = 1

[runtime]
xla_tuning_level = 1
