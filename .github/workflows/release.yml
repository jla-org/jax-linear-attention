# Release: on every pushed tag v*, build the sdist and the wheel, check them with twine, and publish
# them to PyPI with Trusted Publishing (OpenID Connect; no PyPI token is stored in the repository).
#
# One-time setup on pypi.org, Account settings, Publishing: a pending publisher for the project
# jax-linear-attention with owner jla-org, repository jax-linear-attention, workflow release.yml and
# environment pypi. GitHub creates the pypi environment on the first run; required reviewers on it
# are optional.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build the sdist and the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build and twine
        run: python -m pip install "build==1.6.1" "twine==7.0.0"
      - name: Check that the tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/jla/__init__.py)
          echo "tag $GITHUB_REF_NAME, package version $version"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build the sdist and the wheel
        run: python -m build
      - name: Check the distributions
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/jax-linear-attention/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
